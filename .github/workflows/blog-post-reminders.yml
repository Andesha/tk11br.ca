name: Blog post reminders

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on posts due today
        uses: actions/github-script@v8
        with:
          script: |
            const timezone = "America/Toronto";
            const publishDate = new Intl.DateTimeFormat("en-CA", {
              timeZone: timezone,
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            }).format(new Date());
            const marker = `<!-- blog-reminder:${publishDate} -->`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scheduled-post",
              per_page: 100,
            });

            for (const issue of issues) {
              const match = issue.body?.match(/^Publish date: (\d{4}-\d{2}-\d{2})$/m);
              if (!match || match[1] !== publishDate) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              if (comments.some((comment) => comment.body?.includes(marker))) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}\n@Andesha This post is scheduled to publish today.`,
              });
            }
