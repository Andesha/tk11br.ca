{{- $talks := sort (where site.RegularPages "Params.tags" "intersect" (slice "talk")) "Date" "desc" -}}
{{- if $talks -}}
<ul>
  {{- range $talks }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }} &mdash; {{ . }}{{ end }}</li>
  {{- end }}
</ul>
{{- else -}}
<p>No recorded talks yet.</p>
{{- end -}}
